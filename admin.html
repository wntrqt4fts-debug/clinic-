<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Clinik Admin</title>

  <link rel="stylesheet" href="admin.css">

</head>


<body>


<!-- LOGIN -->

<div id="loginScreen" class="login-screen">

  <div class="login-box">

    <div class="login-logo">
      ✚
    </div>

    <p class="small-label">
      CLINIK ADMIN
    </p>

    <h1>
      Welcome back
    </h1>

    <p class="login-description">
      Sign in to manage your medicine store.
    </p>


    <form id="loginForm">

      <label>
        Username
      </label>

      <input
        id="username"
        type="text"
        placeholder="Enter username"
        required
      >


      <label>
        Password
      </label>

      <input
        id="password"
        type="password"
        placeholder="Enter password"
        required
      >


      <button type="submit">
        Sign in →
      </button>

      <p id="loginError"></p>

    </form>

  </div>

</div>



<!-- DASHBOARD -->

<div id="dashboard" class="dashboard hidden">


  <aside class="sidebar">

    <div class="admin-logo">
      ✚ Clinik
    </div>

    <div class="sidebar-title">
      ADMIN PANEL
    </div>

    <button class="side-active">
      💊 Medicines
    </button>

    <a href="index.html">
      🌐 View Store
    </a>

    <button onclick="logout()" class="logout-btn">
      ↪ Logout
    </button>

  </aside>



  <main class="admin-main">


    <header class="admin-header">

      <div>
        <p class="small-label">
          DASHBOARD
        </p>

        <h1>
          Medicine Store
        </h1>
      </div>

      <a
        href="index.html"
        class="view-store"
      >
        View Store ↗
      </a>

    </header>



    <!-- STATS -->

    <section class="stats">

      <div class="stat-card">
        <span>Total Medicines</span>
        <strong id="totalMedicines">0</strong>
      </div>

      <div class="stat-card">
        <span>Categories</span>
        <strong id="totalCategories">0</strong>
      </div>

      <div class="stat-card">
        <span>In Stock</span>
        <strong id="totalStock">0</strong>
      </div>

    </section>



    <!-- ADD MEDICINE -->

    <section class="admin-card">

      <div class="card-heading">

        <div>
          <p class="small-label">
            INVENTORY
          </p>

          <h2 id="formTitle">
            Add Medicine
          </h2>
        </div>

        <button
          id="cancelEdit"
          class="cancel-btn hidden"
          onclick="cancelEdit()"
        >
          Cancel
        </button>

      </div>


      <form id="medicineForm" class="medicine-form">


        <div class="image-upload">

          <label
            for="medicineImage"
            class="upload-box"
          >

            <img
              id="imagePreview"
              src=""
              alt=""
            >

            <div id="uploadText">
              📷
              <br>
              <strong>Upload image</strong>
              <br>
              <small>Click to choose</small>
            </div>

          </label>

          <input
            id="medicineImage"
            type="file"
            accept="image/*"
          >

        </div>



        <div class="form-fields">


          <div class="field">

            <label>
              Medicine Name
            </label>

            <input
              id="medicineName"
              type="text"
              placeholder="e.g. Paracetamol 500mg"
              required
            >

          </div>


          <div class="two-columns">

            <div class="field">

              <label>
                Category
              </label>

              <select id="medicineCategory">

                <option value="Pain Relief">
                  Pain Relief
                </option>

                <option value="Cold & Flu">
                  Cold & Flu
                </option>

                <option value="Vitamins">
                  Vitamins
                </option>

                <option value="Digestive">
                  Digestive
                </option>

                <option value="Other">
                  Other
                </option>

              </select>

            </div>


            <div class="field">

              <label>
                Price (₹)
              </label>

              <input
                id="medicinePrice"
                type="number"
                min="0"
                placeholder="99"
                required
              >

            </div>

          </div>


          <div class="field">

            <label>
              Stock
            </label>

            <input
              id="medicineStock"
              type="number"
              min="0"
              placeholder="50"
              required
            >

          </div>


          <div class="field">

            <label>
              Description
            </label>

            <textarea
              id="medicineDescription"
              rows="4"
              placeholder="Short description..."
            ></textarea>

          </div>


          <button
            type="submit"
            class="save-btn"
          >
            <span id="saveButtonText">
              + Add Medicine
            </span>
          </button>


        </div>

      </form>

    </section>



    <!-- PRODUCT LIST -->

    <section class="admin-card">

      <div class="card-heading">

        <div>

          <p class="small-label">
            PRODUCTS
          </p>

          <h2>
            Your Medicines
          </h2>

        </div>

        <input
          id="adminSearch"
          class="admin-search"
          type="text"
          placeholder="Search..."
          oninput="renderAdminMedicines()"
        >

      </div>


      <div
        id="adminMedicineList"
        class="admin-medicine-list"
      ></div>

    </section>


  </main>

</div>


<script src="admin.js"></script>

</body>
</html>
